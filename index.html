<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dante Alpízar | MG Toreo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --mg-bone: #F7F5F2;
      --mg-black: #0D0E10;
      --mg-red: #E11D2E;
      --mg-ink: #1C1D1F;
      --mg-gray: #6E7175;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #DFDBD5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px 14px;
      gap: 14px;
    }

    .viewer-controls {
      display: flex;
      gap: 6px;
      background: rgba(13, 14, 16, 0.9);
      padding: 6px;
      border-radius: 999px;
    }

    .ctrl-btn {
      background: transparent;
      color: #D1D5DB;
      border: none;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ctrl-btn.active {
      background: var(--mg-red);
      color: #FFFFFF;
    }

    /* Proporción exacta 7x11 cm (350 x 550 px) */
    .badge-card {
      width: 350px;
      max-width: 100%;
      height: 550px;
      position: relative;
      border-radius: 14px;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      background: var(--mg-bone);
    }

    /* ==================== CARA FRONTAL (BLANCA LIMPIA) ==================== */
    .face-front {
      width: 100%;
      height: 100%;
      background: var(--mg-bone);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 26px 28px;
      position: relative;
    }

    .front-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .front-header img {
      height: 44px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .front-dealer {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--mg-ink);
    }

    .front-photo-box {
      width: 196px;
      height: 196px;
      background: #E2E0DC;
      overflow: hidden;
      position: relative;
    }

    .front-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 14%;
      display: block;
    }

    .front-identity {
      text-align: center;
    }

    .front-name {
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--mg-ink);
      margin-bottom: 3px;
    }

    .front-role {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--mg-gray);
      margin-bottom: 14px;
    }

    .front-cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--mg-black);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    /* ==================== CARA TRASERA (NEGRA + TRAZO "More") ==================== */
    .face-back {
      width: 100%;
      height: 100%;
      background: var(--mg-black);
      color: #FFFFFF;
      padding: 24px 22px 22px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Vector exacto del trazo caligráfico rojo "More" solo en el lado negro */
    .more-script-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 165px;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .back-top-links {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      z-index: 15;
    }

    .back-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .back-icon-btn:hover {
      background: var(--mg-red);
    }

    .back-mg-mark {
      display: flex;
      justify-content: flex-end;
      padding-right: 14px;
      z-index: 5;
    }

    .back-mg-mark img {
      height: 54px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .back-bottom-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      z-index: 15;
    }

    .back-qr-box {
      width: 82px;
      height: 82px;
      background: #FFFFFF;
      padding: 4px;
      margin-bottom: 10px;
    }

    .back-qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .back-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 2px;
    }

    .back-role {
      font-size: 0.78rem;
      color: #D1D5DB;
      margin-bottom: 6px;
    }

    .back-contact-line {
      display: block;
      font-size: 0.74rem;
      color: #E5E7EB;
      text-decoration: none;
      margin-bottom: 3px;
    }

    .back-contact-line:hover {
      color: #FFFFFF;
      text-decoration: underline;
    }

    .back-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .back-btn {
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn-wa {
      background: #25D366;
      color: #09130D;
      border: none;
    }

    .back-btn-save {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="viewer-controls">
    <button id="btn-frente" class="ctrl-btn active" onclick="setSide('front')">Frente (Blanco)</button>
    <button id="btn-atras" class="ctrl-btn" onclick="setSide('back')">Atrás (Negro + QR)</button>
  </div>

  <div class="badge-card">
    <!-- CARA FRONTAL (BLANCA LIMPIA SIN LAYER ENCIMA) -->
    <div id="side-front" class="face-front">
      <div class="front-header">
        <img src="logo-mg.png" alt="MG">
        <span class="front-dealer">Toreo</span>
      </div>

      <div class="front-photo-box">
        <img id="front-photo" src="dante-saldivar.jpg" alt="Fotografía">
      </div>

      <div class="front-identity">
        <h1 id="front-name" class="front-name">Dante Alpízar</h1>
        <p id="front-role" class="front-role">Gerente MG Toreo</p>
        <button class="front-cta-pill" onclick="setSide('back')">
          Ver contacto y QR <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </div>

    <!-- CARA TRASERA (NEGRA CON TRAZO CALIGRÁFICO "More" EXACTO) -->
    <div id="side-back" class="face-back">
      <!-- Trazo caligráfico vectorial idéntico al manual oficial MG -->
      <svg class="more-script-svg" viewBox="0 0 170 550" fill="none">
        <path d="M98 518 C72 480, 32 415, 24 388 C18 370, 26 364, 42 376 C60 390, 82 415, 96 428 C76 3
