<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dante Alpízar | MG Toreo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --mg-bone: #F7F5F2;
      --mg-black: #0D0E10;
      --mg-red: #E11D2E;
      --mg-ink: #1C1D1F;
      --mg-gray: #6E7175;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #DFDBD5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px 14px;
      gap: 14px;
    }

    .viewer-controls {
      display: flex;
      gap: 6px;
      background: rgba(13, 14, 16, 0.9);
      padding: 6px;
      border-radius: 999px;
    }

    .ctrl-btn {
      background: transparent;
      color: #D1D5DB;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ctrl-btn.active {
      background: var(--mg-red);
      color: #FFFFFF;
    }

    /* Proporción exacta 7x11 cm (350 x 550 px) con alto fijo seguro */
    .badge-card {
      width: 350px;
      max-width: 100%;
      height: 550px;
      position: relative;
      border-radius: 14px;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      background: var(--mg-bone);
    }

    .more-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    .more-overlay.hidden {
      opacity: 0;
    }

    /* CARA FRONTAL (BLANCA / HUESO) */
    .face-front {
      width: 100%;
      height: 100%;
      background: var(--mg-bone);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 26px 28px;
      position: relative;
    }

    .front-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .front-header img {
      height: 44px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .front-dealer {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--mg-ink);
    }

    .front-photo-box {
      width: 196px;
      height: 196px;
      background: #E2E0DC;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .front-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 14%;
      display: block;
    }

    .front-identity {
      text-align: center;
      z-index: 2;
    }

    .front-name {
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--mg-ink);
      margin-bottom: 3px;
    }

    .front-role {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--mg-gray);
      margin-bottom: 14px;
    }

    .front-cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--mg-black);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    /* CARA TRASERA (NEGRA OFICIAL) */
    .face-back {
      width: 100%;
      height: 100%;
      background: var(--mg-black);
      color: #FFFFFF;
      padding: 24px 22px 22px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .back-top-links {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      z-index: 15;
    }

    .back-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-icon-btn:hover {
      background: var(--mg-red);
    }

    .back-mg-mark {
      display: flex;
      justify-content: flex-end;
      padding-right: 14px;
      z-index: 2;
    }

    .back-mg-mark img {
      height: 54px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .back-bottom-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      z-index: 15;
    }

    .back-qr-box {
      width: 82px;
      height: 82px;
      background: #FFFFFF;
      padding: 4px;
      margin-bottom: 10px;
    }

    .back-qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .back-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 2px;
    }

    .back-role {
      font-size: 0.78rem;
      color: #D1D5DB;
      margin-bottom: 6px;
    }

    .back-contact-line {
      display: block;
      font-size: 0.74rem;
      color: #E5E7EB;
      text-decoration: none;
      margin-bottom: 3px;
    }

    .back-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .back-btn {
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn-wa {
      background: #25D366;
      color: #09130D;
      border: none;
    }

    .back-btn-save {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="viewer-controls">
    <button id="btn-frente" class="ctrl-btn active" onclick="setSide('front')">Frente (Blanco)</button>
    <button id="btn-atras" class="ctrl-btn" onclick="setSide('back')">Atrás (Negro + QR)</button>
    <button id="btn-layer" class="ctrl-btn active" onclick="toggleMore()">Layer "More"</button>
  </div>

  <div class="badge-card">
    <svg id="more-layer" class="more-overlay" viewBox="0 0 350 550" preserveAspectRatio="none">
      <g transform="translate(86, 485) rotate(-78)">
        <text x="0" y="0" font-family="'Caveat', cursive" font-weight="700" font-size="148" fill="#E11D2E" opacity="0.92" letter-spacing="-2">More</text>
      </g>
    </svg>

    <div id="side-front" class="face-front">
      <div class="front-header">
        <img src="logo-mg.png" alt="MG">
        <span class="front-dealer">Toreo</span>
      </div>

      <div class="front-photo-box">
        <img id="front-photo" src="dante-saldivar.jpg" alt="Fotografía">
      </div>

      <div class="front-identity">
        <h1 id="front-name" class="front-name">Dante Alpízar</h1>
        <p id="front-role" class="front-role">Gerente MG Toreo</p>
        <button class="front-cta-pill" onclick="setSide('back')">
          Ver contacto y QR <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </div>

    <div id="side-back" class="face-back">
      <div class="back-top-links">
        <a id="link-maps" href="#" target="_blank" class="back-icon-btn" title="Ubicación MG Toreo">
          <i class="fa-solid fa-location-dot"></i>
        </a>
        <a id="link-fb" href="#" target="_blank" class="back-icon-btn" title="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a id="link-ig" href="#" target="_blank" class="back-icon-btn" title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a id="link-tt" href="#" target="_blank" class="back-icon-btn" title="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>

      <div class="back-mg-mark">
        <img src="logo-mg.png" alt="MG Motor">
      </div>

      <div class="back-bottom-right">
        <div id="qr-box" class="back-qr-box"></div>
        <div id="back-name" class="back-name">Dante Alpízar</div>
        <div id="back-role" class="back-role">Gerente MG Toreo</div>
        <a id="back-tel" href="#" class="back-contact-line">Tel.: 55 4787 0128</a>
        <a id="back-email" href="#" class="back-contact-line">email: dbalpizar@carone.com.mx</a>

        <div class="back-actions">
          <a id="btn-wa" href="#" target="_blank" class="back-btn back-btn-wa">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
          </a>
          <button onclick="downloadVCard()" class="back-btn back-btn-save">
            <i class="fa-solid fa-user-plus"></i> Guardar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AGENCIA = {
      maps: "https://maps.app.goo.gl/vEF1MsPCo523ftr98",
      facebook: "https://www.facebook.com/profile.php?id=61584625586744",
      instagram: "https://www.instagram.com/mgtoreo/",
      tiktok: "https://www.tiktok.com/@mgtoreo"
    };

    const COLABORADORES = {
      "dante-alpizar": {
        nombre: "Dante Alpízar",
        cargo: "Gerente MG Toreo",
        whatsapp: "5215547870128",
        telefonoDisplay: "55 4787 0128",
        correo: "dbalpizar@carone.com.mx",
        foto: "dante-saldivar.jpg"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "dante-alpizar";
    const persona = COLABORADORES[id] || COLABORADORES["dante-alpizar"];

    document.title = `${persona.nombre} | MG Toreo`;
    document.getElementById("front-name").textContent = persona.nombre;
    document.getElementById("front-role").textContent = persona.cargo;
    document.getElementById("front-photo").src = persona.foto;

    document.getElementById("back-name").textContent = persona.nombre;
    document.getElementById("back-role").textContent = persona.cargo;
    document.getElementById("back-tel").textContent = `Tel.: ${persona.telefonoDisplay}`;
    document.getElementById("back-tel").href = `tel:+52${persona.telefonoDisplay.replace(/\s+/g, "")}`;
    document.getElementById("back-email").textContent = `email: ${persona.correo}`;
    document.getElementById("back-email").href = `mailto:${persona.correo}?subject=${encodeURIComponent("Contacto MG Toreo")}`;

    const mensajeWA = `Hola ${persona.nombre}, escaneé tu credencial en MG Toreo y me gustaría recibir atención.`;
    document.getElementById("btn-wa").href = `https://wa.me/${persona.whatsapp}?text=${encodeURIComponent(mensajeWA)}`;
    document.getElementById("link-maps").href = AGENCIA.maps;
    document.getElementById("link-fb").href = AGENCIA.facebook;
    document.getElementById("link-ig").href = AGENCIA.instagram;
    document.getElementById("link-tt").href = AGENCIA.tiktok;

    const urlCredencial = `${window.location.origin}${window.location.pathname}?id=${id}`;
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=svg&color=0D0E10&bgcolor=FFFFFF&margin=0&data=${encodeURIComponent(urlCredencial)}`;
    document.getElementById("qr-box").innerHTML = `<img src="${qrApiUrl}" alt="QR ${persona.nombre}">`;

    function setSide(side) {
      const front = document.getElementById("side-front");
      const back = document.getElementById("side-back");
      const btnF = document.getElementById("btn-frente");
      const btnB = document.getElementById("btn-atras");

      if (side === "front") {
        front.style.display = "flex";
        back.style.display = "none";
        btnF.classList.add("active");
        btnB.classList.remove("active");
      } else {
        front.style.display = "none";
        back.style.display = "flex";
        btnB.classList.add("active");
        btnF.classList.remove("active");
      }
    }

    function toggleMore() {
      const layer = document.getElementById("more-layer");
      const btn = document.getElementById("btn-layer");
      layer.classList.toggle("hidden");
      btn.classList.toggle("active");
    }

    function downloadVCard() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${persona.nombre}`,
        "ORG:MG Toreo - Grupo Car One",
        `TITLE:${persona.cargo}`,
        `TEL;TYPE=CELL,VOICE:+${persona.whatsapp}`,
        `EMAIL;TYPE=WORK,INTERNET:${persona.correo}`,
        `URL:${AGENCIA.maps}`,
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${persona.nombre.replace(/\s+/g, "_")}_MG_Toreo.vcf`;
      a.click();
    }
  </script>

</body>
</html>
