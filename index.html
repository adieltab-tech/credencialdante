<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial Oficial MG Motor | Dante Alpízar</title>

  <style>
    :root {
      --mg-bone: #F7F5F2;
      --mg-black: #0D0E10;
      --mg-red: #E11D2E;
      --mg-ink: #1C1D1F;
      --mg-gray: #6E7175;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #DFDBD5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px 14px;
      gap: 14px;
    }

    /* Barra superior discreta para girar el gafete o quitar el layer "More" */
    .viewer-controls {
      display: flex;
      gap: 8px;
      background: rgba(13, 14, 16, 0.85);
      padding: 6px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .ctrl-btn {
      background: transparent;
      color: #D1D5DB;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ctrl-btn.active {
      background: var(--mg-red);
      color: #FFFFFF;
    }

    /* Contenedor con proporción exacta 7x11 cm (350 x 550 px) */
    .badge-stage {
      width: 100%;
      max-width: 350px;
      aspect-ratio: 7 / 11;
      position: relative;
      perspective: 1200px;
    }

    .badge-card {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 14px;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      transition: opacity 0.25s ease;
    }

    /* Layer Acetato "More" (sobrepuesto como en la guía oficial) */
    .more-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.25s ease;
    }

    .more-overlay.hidden {
      opacity: 0;
    }

    /* ==================== CARA FRONTAL (BLANCA / HUESO) ==================== */
    .face-front {
      width: 100%;
      height: 100%;
      background: var(--mg-bone);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 34px 28px 32px;
      position: relative;
    }

    .front-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .front-header img {
      height: 44px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .front-dealer {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--mg-ink);
      letter-spacing: 0.2px;
    }

    /* Fotografía cuadrada oficial según Master Graphic */
    .front-photo-box {
      width: 196px;
      height: 196px;
      background: #E2E0DC;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .front-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 14%;
      display: block;
    }

    .front-identity {
      text-align: center;
      z-index: 2;
    }

    .front-name {
      font-size: 1.18rem;
      font-weight: 600;
      color: var(--mg-ink);
      margin-bottom: 3px;
    }

    .front-role {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--mg-gray);
      margin-bottom: 14px;
    }

    .front-cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--mg-black);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    /* ==================== CARA TRASERA (NEGRA OFICIAL) ==================== */
    .face-back {
      width: 100%;
      height: 100%;
      background: var(--mg-black);
      color: #FFFFFF;
      padding: 26px 24px 24px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .back-top-links {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      z-index: 15;
    }

    .back-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .back-icon-btn:hover {
      background: var(--mg-red);
    }

    /* Logo MG blanco centrado a la derecha como en la guía */
    .back-mg-mark {
      display: flex;
      justify-content: flex-end;
      padding-right: 16px;
      margin-top: 8px;
      z-index: 2;
    }

      height: 54px;
      width: auto;
      filter: brightness(0)
