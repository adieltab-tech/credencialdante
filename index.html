<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dante Alpízar | MG Toreo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --mg-bone: #F6F4F0;
      --mg-black: #0D0E10;
      --mg-red: #E31C24;
      --mg-ink: #1D1E20;
      --mg-gray: #5A5D62;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background: #DFDBD5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }

    #flip-toggle {
      display: none;
    }

    /* Selector minimalista fuera del gafete para voltear Frente / Atrás */
    .flip-bar {
      display: flex;
      gap: 6px;
      background: rgba(13, 14, 16, 0.88);
      padding: 4px;
      border-radius: 999px;
    }

    .flip-tab {
      color: #D1D5DB;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    #flip-toggle:not(:checked) ~ .flip-bar .tab-front,
    #flip-toggle:checked ~ .flip-bar .tab-back {
      background: #FFFFFF;
      color: #0D0E10;
      font-weight: 600;
    }

    /* Proporción exacta Master Graphic Gafete Dealers: 7 x 11 cm (350 x 550 px) */
    .gafete-wrapper {
      width: 350px;
      max-width: 100%;
      height: 550px;
      position: relative;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      background: var(--mg-bone);
    }

    #flip-toggle:not(:checked) ~ .gafete-wrapper .cara-frente {
      display: flex;
    }
    #flip-toggle:not(:checked) ~ .gafete-wrapper .cara-atras {
      display: none;
    }
    #flip-toggle:checked ~ .gafete-wrapper .cara-frente {
      display: none;
    }
    #flip-toggle:checked ~ .gafete-wrapper .cara-atras {
      display: flex;
    }

    /* Trazo rojo caligráfico "More" exacto del acetato oficial */
    .more-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 155px;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* ==================== CARA FRONTAL (BLANCA / HUESO) ==================== */
    .cara-frente {
      width: 100%;
      height: 100%;
      background: var(--mg-bone);
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 44px 28px 46px;
      position: relative;
    }

    .frente-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .frente-top img {
      height: 44px;
      width: auto;
      object-fit: contain;
      /* Convierte el logo rojo a negro/gris oscuro monocromático como en la guía */
      filter: grayscale(100%) contrast(160%);
      mix-blend-mode: multiply;
    }

    .frente-dealer {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--mg-gray);
      letter-spacing: 0.2px;
    }

    .frente-foto {
      width: 204px;
      height: 204px;
      background: #E0DDD7;
      overflow: hidden;
      z-index: 2;
    }

    .frente-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 14%;
      display: block;
    }

    .frente-datos {
      text-align: center;
      z-index: 2;
    }

    .frente-nombre {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--mg-ink);
      margin-bottom: 2px;
    }

    .frente-cargo {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--mg-gray);
    }

    /* ==================== CARA TRASERA (NEGRA OFICIAL) ==================== */
    .cara-atras {
      width: 100%;
      height: 100%;
      background: var(--mg-black);
      color: #FFFFFF;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 24px 26px;
      position: relative;
    }

    /* Logo MG blanco centrado a la derecha según Master Graphic */
    .atras-logo {
      position: absolute;
      top: 47%;
      right: 42px;
      transform: translateY(-50%);
      z-index: 5;
    }

    .atras-logo img {
      height: 56px;
      width: auto;
      filter: brightness(0) invert(1);
      display: block;
    }

    /* Bloque inferior derecho: QR + 4 líneas alineadas a la derecha */
    .atras-bloque-derecho {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      z-index: 15;
      position: relative;
    }

    .atras-qr {
      width: 78px;
      height: 78px;
      background: #FFFFFF;
      padding: 3px;
      margin-bottom: 12px;
    }

    .atras-qr img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .atras-texto {
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.38;
      color: #F3F4F6;
      text-decoration: none;
      display: block;
    }

    .atras-texto:hover {
      text-decoration: underline;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <input type="checkbox" id="flip-toggle">

  <div class="flip-bar">
    <label for="flip-toggle" class="flip-tab tab-front">Frente</label>
    <label for="flip-toggle" class="flip-tab tab-back">Atrás</label>
  </div>

  <div class="gafete-wrapper">
    <!-- Acetato oficial con el trazo exacto de "More" de la guía MG Motor -->
    <svg class="more-layer" viewBox="0 0 155 550" fill="none">
      <!-- Letra M -->
      <path d="M88 518 C66 485, 36 435, 22 404 C17 392, 23 386, 35 396 C50 408, 68 428, 82 440 C65 406, 46 372, 40 354 C36 342, 43 336, 55 346 C70 358, 88 380, 100 396"
            stroke="#E31C24" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Letra o -->
      <path d="M84 334 C68 337, 58 322, 62 304 C66 286, 84 276, 97 284 C110 292, 110 314, 97 326 C88 334, 77 335, 72 328"
            stroke="#E31C24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Letra r -->
      <path d="M104 266 C88 258, 72 246, 66 234 C62 226, 69 222, 78 228 C86 232, 79 212, 77 198 C75 186, 82 182, 93 190 C100 195, 106 199, 110 192"
            stroke="#E31C24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Letra e -->
      <path d="M99 164 C104 146, 99 125, 86 120 C75 116, 68 125, 73 140 C79 155, 101 162, 115 149 C126 138, 122 112, 106 78"
            stroke="#E31C24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- CARA FRONTAL OFICIAL (7x11 cm) -->
    <div class="cara-frente">
      <div class="frente-top">
        <img src="logo-mg.png" alt="MG">
        <span class="frente-dealer">Toreo</span>
      </div>

      <div class="frente-foto">
        <img id="front-photo" src="dante-saldivar.jpg" alt="Dante Alpízar">
      </div>

      <div class="frente-datos">
        <div id="front-name" class="frente-nombre">Dante Alpízar</div>
        <div id="front-role" class="frente-cargo">Gerente MG Toreo</div>
      </div>
    </div>

    <!-- CARA TRASERA OFICIAL (7x11 cm) -->
    <div class="cara-atras">
      <div class="atras-logo">
        <img src="logo-mg.png" alt="MG">
      </div>

      <div class="atras-bloque-derecho">
        <div id="qr-box" class="atras-qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=svg&color=0D0E10&bgcolor=FFFFFF&margin=0&data=https%3A%2F%2Fcredencialdante.vercel.app%2F%3Fid%3Ddante-alpizar" alt="QR">
        </div>
        <div id="back-name" class="atras-texto">Dante Alpízar</div>
        <div id="back-role" class="atras-texto">Gerente MG Toreo</div>
        <a id="back-tel" href="https://wa.me/5215547870128?text=Hola%20Dante%20Alp%C3%ADzar%2C%20escane%C3%A9%20tu%20credencial%20de%20MG%20Toreo." target="_blank" rel="noopener" class="atras-texto">Tel.: 55 4787 0128</a>
        <a id="back-email" href="mailto:dbalpizar@carone.com.mx?subject=Contacto%20MG%20Toreo" class="atras-texto">email: dbalpizar@carone.com.mx</a>
      </div>
    </div>
  </div>

  <script>
    const COLABORADORES = {
      "dante-alpizar": {
        nombre: "Dante Alpízar",
        cargo: "Gerente MG Toreo",
        whatsapp: "5215547870128",
        telefonoDisplay: "55 4787 0128",
        correo: "dbalpizar@carone.com.mx",
        foto: "dante-saldivar.jpg"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "dante-alpizar";
    const persona = COLABORADORES[id] || COLABORADORES["dante-alpizar"];

    document.title = `${persona.nombre} | MG Toreo`;
    document.getElementById("front-name").textContent = persona.nombre;
    document.getElementById("front-role").textContent = persona.cargo;
    document.getElementById("front-photo").src = persona.foto;

    document.getElementById("back-name").textContent = persona.nombre;
    document.getElementById("back-role").textContent = persona.cargo;
    document.getElementById("back-tel").textContent = `Tel.: ${persona.telefonoDisplay}`;
    document.getElementById("back-tel").href = `https://wa.me/${persona.whatsapp}?text=${encodeURIComponent(`Hola ${persona.nombre}, escaneé tu credencial de MG Toreo.`)}`;
    document.getElementById("back-email").textContent = `email: ${persona.correo}`;
    document.getElementById("back-email").href = `mailto:${persona.correo}?subject=${encodeURIComponent("Contacto MG Toreo")}`;

    const urlCredencial = `${window.location.origin}${window.location.pathname}?id=${id}`;
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&format=svg&color=0D0E10&bgcolor=FFFFFF&margin=0&data=${encodeURIComponent(urlCredencial)}`;
    document.getElementById("qr-box").innerHTML = `<img src="${qrApiUrl}" alt="QR ${persona.nombre}">`;
  </script>

</body>
</html>
