<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credencial Digital | MG Toreo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --mg-red: #ba0c2f;
      --mg-red-dark: #8a0822;
      --text-dark: #111827;
      --text-gray: #4b5563;
      --card-surface: #ffffff;
      --row-bg: #f3f4f6;
      --border-light: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: var(--card-surface);
      width: 100%;
      max-width: 390px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
      position: relative;
      text-align: center;
    }

    .top-header {
      padding: 22px 22px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 3;
    }

    .mg-lockup {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mg-lockup img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .mg-lockup-text {
      text-align: left;
      line-height: 1.05;
    }

    .mg-lockup-text span:first-child {
      display: block;
      font-size: 0.95rem;
      font-weight: 800;
      color: #111827;
    }

    .mg-lockup-text span:last-child {
      display: block;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--mg-red);
    }

    .carone-logo {
      height: 24px;
      width: auto;
      object-fit: contain;
    }

    .red-ribbon-area {
      position: relative;
      height: 145px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .red-ribbon-svg {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      height: 115px;
      z-index: 1;
    }

    .avatar-ring {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--mg-red), var(--mg-red-dark));
      position: relative;
      z-index: 2;
      box-shadow: 0 10px 25px rgba(186, 12, 47, 0.25);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 15%;
      border: 3px solid #ffffff;
      background: #f9fafb;
      display: block;
    }

    .profile-data {
      padding: 6px 22px 18px;
    }

    .profile-name {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.4px;
      margin-bottom: 3px;
    }

    .profile-role {
      font-size: 0.95rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    .profile-brand {
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b7280;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 22px 16px;
    }

    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-wa {
      background: #25D366;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.28);
    }

    .btn-vcard {
      background: #ffffff;
      color: var(--text-dark);
      border: 1.5px solid #d1d5db;
    }

    .contact-rows {
      padding: 0 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      background: var(--row-bg);
      padding: 12px 16px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-dark);
      transition: background 0.15s ease;
    }

    .contact-row:hover {
      background: #e5e7eb;
    }

    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e5e7eb;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .row-info {
      text-align: left;
      flex-grow: 1;
      overflow: hidden;
    }

    .row-title {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #111827;
    }

    .row-sub {
      display: block;
      font-size: 0.78rem;
      color: #4b5563;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .social-heading {
      font-size: 0.7rem;
      font-weight: 700;
      color: #6b7280;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      padding-bottom: 20px;
    }

    .social-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1f2937;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .social-circle:hover {
      background: var(--mg-red);
      transform: translateY(-2px);
    }

    .card-footer {
      background: #f9fafb;
      padding: 12px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #6b7280;
      letter-spacing: 0.6px;
      border-top: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-header">
      <div class="mg-lockup">
        <img src="logo-mg.png" alt="MG">
        <div class="mg-lockup-text">
          <span>MG</span>
          <span>Toreo</span>
        </div>
      </div>
      <img class="carone-logo" src="logo-carone.png" alt="Car One">
    </div>

    <div class="red-ribbon-area">
      <svg class="red-ribbon-svg" viewBox="0 0 400 120" preserveAspectRatio="none">
        <defs>
          <linearGradient id="mgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d91e36" />
            <stop offset="50%" stop-color="#ba0c2f" />
            <stop offset="100%" stop-color="#7f0820" />
          </linearGradient>
        </defs>
        <path d="M-10,20 Q200,115 410,15 L410,48 Q200,135 -10,45 Z" fill="url(#mgGrad)" />
      </svg>

      <div class="avatar-ring">
        <img id="user-photo" src="dante-saldivar.jpg" alt="Foto Colaborador">
      </div>
    </div>

    <div class="profile-data">
      <h1 id="user-name" class="profile-name">Dante Saldivar</h1>
      <p id="user-role" class="profile-role">Gerente MG Toreo</p>
      <p class="profile-brand">MG MOTOR · GRUPO CAR ONE</p>
    </div>

    <div class="action-grid">
      <a id="btn-whatsapp" href="#" target="_blank" class="btn-main btn-wa">
        <i class="fa-brands fa-whatsapp" style="font-size:1.15rem;"></i> WhatsApp
      </a>
      <button onclick="downloadVCard()" class="btn-main btn-vcard">
        <i class="fa-solid fa-user-plus"></i> Guardar
      </button>
    </div>

    <div class="contact-rows">
      <a id="btn-phone" href="#" class="contact-row">
        <div class="row-icon"><i class="fa-solid fa-phone"></i></div>
        <div class="row-info">
          <span class="row-title">Llamar Directo</span>
          <span id="label-phone" class="row-sub">55 4787 0128</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:#9ca3af; font-size:0.8rem;"></i>
      </a>

      <a id="btn-email" href="#" class="contact-row">
        <div class="row-icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="row-info">
          <span class="row-title">Correo Electrónico</span>
          <span id="label-email" class="row-sub">dbalpizar@carone.com.mx</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:#9ca3af; font-size:0.8rem;"></i>
      </a>

      <a id="btn-maps" href="#" target="_blank" class="contact-row">
        <div class="row-icon"><i class="fa-solid fa-location-dot"></i></div>
        <div class="row-info">
          <span class="row-title">Ubicación Agencia</span>
          <span class="row-sub">MG Toreo</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:#9ca3af; font-size:0.8rem;"></i>
      </a>
    </div>

    <p class="social-heading">Síguenos en redes oficiales</p>
    <div class="social-row">
      <a id="social-fb" href="#" target="_blank" class="social-circle" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a id="social-ig" href="#" target="_blank" class="social-circle" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a id="social-tt" href="#" target="_blank" class="social-circle" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>
    </div>

    <div class="card-footer">
      CREDENCIAL DIGITAL OFICIAL · MG TOREO
    </div>
  </div>

  <script>
    const AGENCIA = {
      maps: "https://maps.app.goo.gl/vEF1MsPCo523ftr98",
      facebook: "https://www.facebook.com/profile.php?id=61584625586744",
      instagram: "https://www.instagram.com/mgtoreo/",
      tiktok: "https://www.tiktok.com/@mgtoreo"
    };

    const COLABORADORES = {
      "dante-saldivar": {
        nombre: "Dante Saldivar",
        cargo: "Gerente MG Toreo",
        whatsapp: "5215547870128",
        telefonoDisplay: "55 4787 0128",
        correo: "dbalpizar@carone.com.mx",
        foto: "dante-saldivar.jpg"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "dante-saldivar";
    const persona = COLABORADORES[id] || COLABORADORES["dante-saldivar"];

    document.title = `${persona.nombre} | MG Toreo`;
    document.getElementById("user-name").textContent = persona.nombre;
    document.getElementById("user-role").textContent = persona.cargo;
    document.getElementById("user-photo").src = persona.foto;
    document.getElementById("label-phone").textContent = persona.telefonoDisplay;
    document.getElementById("label-email").textContent = persona.correo;

    const mensajeWA = `Hola ${persona.nombre}, escaneé tu credencial digital en MG Toreo y me gustaría recibir atención.`;
    document.getElementById("btn-whatsapp").href = `https://wa.me/${persona.whatsapp}?text=${encodeURIComponent(mensajeWA)}`;
    document.getElementById("btn-phone").href = `tel:+52${persona.telefonoDisplay.replace(/\s+/g, "")}`;
    document.getElementById("btn-email").href = `mailto:${persona.correo}?subject=${encodeURIComponent("Contacto MG Toreo")}`;
    document.getElementById("btn-maps").href = AGENCIA.maps;

    document.getElementById("social-fb").href = AGENCIA.facebook;
    document.getElementById("social-ig").href = AGENCIA.instagram;
    document.getElementById("social-tt").href = AGENCIA.tiktok;

    function downloadVCard() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${persona.nombre}`,
        "ORG:MG Toreo - Grupo Car One",
        `TITLE:${persona.cargo}`,
        `TEL;TYPE=CELL,VOICE:+${persona.whatsapp}`,
        `EMAIL;TYPE=WORK,INTERNET:${persona.correo}`,
        `URL:${AGENCIA.maps}`,
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${persona.nombre.replace(/\s+/g, "_")}_MG_Toreo.vcf`;
      a.click();
    }
  </script>

</body>
</html>
